spring:
  application:
    name: api-gateway

server:
  port: ${SERVER_PORT:8080}

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-this-32byte-minimum-secret}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:*}
