spring:
  application:
    name: user
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-this-32byte-minimum-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

admin:
  email: ${ADMIN_EMAIL:admin@ecommerce.local}
  password: ${ADMIN_PASSWORD:admin12345}
  name: ${ADMIN_NAME:Administrator}
